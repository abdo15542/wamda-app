name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.5"

      - name: Restore debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: wamda-debug-keystore-v1

      - name: Build debug APKs (Arabic + English)
        run: gradle assembleArDebug assembleEnDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: wamda-app-ar-debug
          path: app/build/outputs/apk/ar/debug/app-ar-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: libya-pulse-app-en-debug
          path: app/build/outputs/apk/en/debug/app-en-debug.apk
