name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.5"

      - name: Restore debug keystore
        uses: actions/cache@v4
        with:
          path: app/debug.keystore
          key: wamda-debug-keystore-v2

      - name: Ensure debug keystore exists
        run: |
          if [ ! -f app/debug.keystore ]; then
            keytool -genkeypair -v -keystore app/debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
          fi
          ls -l app/debug.keystore

      - name: Build debug APKs (Arabic + English)
        run: gradle assembleArDebug assembleEnDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: wamda-app-ar-debug
          path: app/build/outputs/apk/ar/debug/app-ar-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: libya-pulse-app-en-debug
          path: app/build/outputs/apk/en/debug/app-en-debug.apk
